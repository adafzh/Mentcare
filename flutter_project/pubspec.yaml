name: mentcare
description: Mental Health Care Application for Teens.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  camera: ^0.10.5+5
  google_mlkit_face_detection: ^0.11.0
  provider: ^6.1.1
  lucide_icons: ^0.320.0
  flutter_svg: ^2.0.9
  animate_do: ^3.3.4 # Untuk animasi transisi yang halus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Pastikan Anda mendaftarkan folder assets di sini
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: TT Commons
      fonts:
        - asset: assets/fonts/TTCommons-Regular.otf
          weight: 400
        - asset: assets/fonts/TTCommons-Medium.otf
          weight: 500
        - asset: assets/fonts/TTCommons-Bold.otf
          weight: 700

